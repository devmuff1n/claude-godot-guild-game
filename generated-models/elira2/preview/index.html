:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a13; --panel:#1c241a; --ink:#e6ecdc; --muted:#9aa78f; --line:#2f3a2b;
  --accent:#6fbf7c; --accent-ink:#0f1a10; --copper:#e08a4c; --stage:#1a2118; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a13; --panel:#1c241a; --ink:#e6ecdc; --muted:#9aa78f; --line:#2f3a2b;
  --accent:#6fbf7c; --accent-ink:#0f1a10; --copper:#e08a4c; --stage:#1a2118; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;max-width:1200px;margin:0 auto;height:100%}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-family:var(--mono);font-size:12px}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:6px;min-height:420px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto}
.now{font-family:var(--display);font-size:20px;background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:4px;min-width:200px}
.time{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:110px}
.bar{flex:1 1 160px;height:4px;background:var(--line);border-radius:2px;position:relative;min-width:120px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--copper);border-radius:2px}
aside{display:flex;flex-direction:column;gap:14px;min-width:0;overflow:auto}
.group h2{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.list{display:flex;flex-direction:column;gap:4px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:4px;padding:6px 10px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
button:hover{background:var(--panel);border-color:var(--line)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button small{font-family:var(--mono);font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row button{flex:1;justify-content:center;text-align:center;border-color:var(--line)}
[hidden]{display:none!important}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--muted)}
.heroes{display:flex;gap:6px}
.heroes button{border-color:var(--line);font-family:var(--display);font-size:16px;padding:4px 14px}
#groups{display:flex;flex-direction:column;gap:14px}
@media (max-width:760px){.wrap{grid-template-columns:1fr;height:auto}.stage{height:62vh;min-height:340px}aside{overflow:visible}}

const ground = new THREE.Mesh(new THREE.CircleGeometry(2.6,48), new THREE.ShadowMaterial({opacity:0.22}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const ring = new THREE.Mesh(new THREE.RingGeometry(0.62,0.64,64), new THREE.MeshBasicMaterial({transparent:true,opacity:0.35}));
ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
function theme(){ scene.background = new THREE.Color(css('--stage')); ring.material.color = new THREE.Color(css('--accent')); }
theme(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
const VIEWS = {'Спереди':[0,1.0,3.6],'Сбоку':[3.4,1.0,0.6],'Три четверти':[2.4,1.3,2.8],'Сзади':[-1.6,1.3,-3.0]};
function view(k){ const p=VIEWS[k], z=H?H.zoom:1, ty=H?H.target:0.78; cam.position.set(p[0]*z,p[1]*z,p[2]*z); controls.target.set(0,ty,0); controls.update(); }
function resize(){ const r=stage.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); cam.aspect=r.width/r.height; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

let mixer=null, root=null, actions = {}, current = null, comboIdx = -1, speed = 1, label = {}, buttons = {};
const $now=document.getElementById('now'), $time=document.getElementById('time'), $prog=document.getElementById('prog');
const $groups=document.getElementById('groups'), $loading=document.getElementById('loading');
for (const s of [0.25,0.5,1]){ const b=document.createElement('button'); b.type='button'; b.id='sp-'+s; b.textContent='×'+s;
  b.setAttribute('aria-pressed', s===1?'true':'false');
  b.onclick=()=>{speed=s; if(mixer) mixer.timeScale=s; document.querySelectorAll('#speed button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));};
  document.getElementById('speed').append(b); }
for (const k of Object.keys(VIEWS)){ const b=document.createElement('button'); b.type='button'; b.textContent=k; b.onclick=()=>view(k); document.getElementById('cams').append(b); }
function buildList(){
  $groups.textContent=''; buttons={};
  label = Object.fromEntries(H.clips.map(c=>[c[1],c[2]]));
  for (const [g,head] of H.groups){
    const d=document.createElement('div'); d.className='group';
    d.innerHTML=`<h2>${head}</h2><div class="list" id="g-${g}"></div>`; $groups.append(d);
  }
  for (const [g,id,name] of H.clips){
    const b=document.createElement('button'); b.id='clip-'+id; b.type='button'; b.setAttribute('aria-pressed','false');
    b.innerHTML=`<span>${name}</span><small></small>`; b.onclick=()=> H.combos[id]?startCombo(id):play(id,false);
    document.getElementById('g-'+g).append(b); buttons[id]=b;
  }
}
function mark(id){ for (const k in buttons) buttons[k].setAttribute('aria-pressed', k===id?'true':'false'); }
function play(id, inCombo){
  if(!inCombo){ comboIdx=-1; mark(id); }
  const a=actions[id]; if(!a) return;
  const once=!H.loop.has(id) || inCombo;
  a.reset(); a.setLoop(THREE.LoopRepeat, Infinity);
  if(once){ a.clampWhenFinished=true; a.setLoop(THREE.LoopRepeat, inCombo?(H.repeat[id]||1):1); }
  if(current && current!==a) a.crossFadeFrom(current, inCombo?0.12:0.2, false);
  a.play(); current=a; $now.textContent = inCombo ? label[comboId]+' · '+label[id] : label[id];
}
function startCombo(cid){ comboId=cid; COMBO=H.combos[cid]; mark(cid); comboIdx=0; play(COMBO[0], true); }
const loader = new THREE.GLTFLoader();
function need(h){
  return new Promise((ok,fail)=>{
    if(window[h.glb]) return ok();
    const s=document.createElement('script'); s.src=h.src; s.onload=()=>ok(); s.onerror=fail; document.head.append(s);
  });
}
let loadSeq=0;
function setHero(key){
  const h=HEROES[key]||HEROES.elira, seq=++loadSeq;
  for (const k in HEROES) document.getElementById('hero-'+k).setAttribute('aria-pressed', HEROES[k]===h?'true':'false');
  try{ localStorage.setItem('hero3d', key); }catch(e){}
  H=h; document.getElementById('h1').textContent=h.title; document.getElementById('meta').textContent=h.meta;
  if(root){ mixer.stopAllAction(); scene.remove(root); root=null; mixer=null; }
  actions={}; current=null; comboIdx=-1; $now.textContent='—'; $prog.style.width='0';
  buildList(); view('Три четверти');
  $loading.textContent='Загрузка модели…'; $loading.hidden=false;
  need(h).then(()=>{
    if(seq!==loadSeq) return;
    const bin=Uint8Array.from(atob(window[h.glb]),c=>c.charCodeAt(0)).buffer;
    loader.parse(bin, '', g=>{
      if(seq!==loadSeq) return;
      root=g.scene; root.traverse(o=>{ if(o.isMesh){o.castShadow=true; o.frustumCulled=false;} });
      scene.add(root); mixer=new THREE.AnimationMixer(root); mixer.timeScale=speed;
      for (const c of g.animations){ actions[c.name]=mixer.clipAction(c);
        const b=buttons[c.name]; if(b) b.querySelector('small').textContent=c.duration.toFixed(1)+' с'; }
      for (const cid in h.combos) if(buttons[cid]) buttons[cid].querySelector('small').textContent=h.combos[cid].length+' клипов';
      mixer.addEventListener('finished', e=>{
        if(comboIdx<0) return;
        comboIdx=(comboIdx+1)%COMBO.length; play(COMBO[comboIdx], true);
      });
      $loading.hidden=true;
      startCombo(h.start);
    }, err=>{ $loading.textContent='Модель не загрузилась'; console.error(err); });
  }, ()=>{ $loading.textContent='Модель не загрузилась'; });
}
for (const k in HEROES) document.getElementById('hero-'+k).onclick=()=>setHero(k);
let first='elira';
try{ first=localStorage.getItem('hero3d')||first; }catch(e){}
if(location.hash.slice(1) in HEROES) first=location.hash.slice(1);
setHero(first);
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=clock.getDelta(); if(mixer) mixer.update(dt);
  if(current){ const d=current.getClip().duration, t=Math.min(current.time,d);
    $time.textContent=`${Math.round(t*30)} / ${Math.round(d*30)} к`; $prog.style.width=(100*t/d).toFixed(1)+'%'; }
  controls.update(); renderer.render(scene,cam);
});
</script>
